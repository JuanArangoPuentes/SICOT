# ═══════════════════════════════════════════════════════════════════════════
# Entorno de ENSAYO — el lugar donde una migración puede salir mal.
#
# ¿POR QUÉ EXISTE?
# Hasta ahora solo había dos entornos: desarrollo y producción. No existía
# ningún lugar intermedio donde probar una migración de Flyway contra datos
# parecidos a los reales antes de aplicarla sobre los de verdad. Para un
# sistema que va a acumular contratos públicos durante años, eso significa que
# la primera vez que una migración se ejecuta sobre datos reales es también la
# única, y sin vuelta atrás salvo restaurar un respaldo.
#
# CÓMO SE USA (en el portátil de quien va a aplicar el cambio)
#
#   0. Una vez: añadir al .env de esta carpeta un secreto de sesión propio del
#      ensayo, que no sea ni el de desarrollo ni el del servidor:
#        ENSAYO_JWT_SECRET=<la salida de `openssl rand -base64 48`>
#
#   1. Tomar un respaldo de producción EN EL SERVIDOR y traer el .dump:
#        ./scripts/respaldo-sicot.sh /var/backups/sicot
#      Son los datos reales del Centro: bórrelos del portátil al terminar.
#
#   2. Levantar SOLO la base de ensayo, que arranca vacía y en un volumen aparte:
#        docker compose -f docker-compose.yml -f docker-compose.ensayo.yml up -d db
#
#   3. Cargar el respaldo en la base de ensayo (desde Git Bash o Linux:
#      PowerShell no admite la redirección `<`):
#        docker exec -i sicot-ensayo-db pg_restore -U sicot -d sicot --clean --if-exists < ./sicot-XXXX.dump
#      Antes de levantar el backend, a propósito: así Flyway ve los datos
#      restaurados tal como están en producción, no una base que él mismo creó.
#
#   4. Levantar la versión nueva del backend y observar qué hace Flyway con los
#      datos restaurados (la interfaz queda en http://localhost:18443):
#        docker compose -f docker-compose.yml -f docker-compose.ensayo.yml up -d --build
#        docker compose -f docker-compose.yml -f docker-compose.ensayo.yml logs -f backend
#
#   5. Destruirlo. Se puede repetir desde el paso 2 sin consecuencias:
#        docker compose -f docker-compose.yml -f docker-compose.ensayo.yml down -v
#
# LAS DECISIONES QUE LO HACEN SEGURO
#
#   - **Proyecto propio** (`name: sicot-ensayo`). Es lo que de verdad lo separa
#     del entorno de desarrollo: contenedores, red, imágenes y volúmenes llevan
#     otro prefijo, así que el `up` no recrea los contenedores de desarrollo y
#     el `down -v` del paso 5 solo puede borrar volúmenes de este proyecto.
#     Antes no lo tenía y heredaba `name: sicot` del archivo base: el `up`
#     recreaba los contenedores de desarrollo, el `pg_restore` caía sobre la
#     base de desarrollo y el `down -v` borraba `sicot_db_data`.
#
#   - **Volumen propio** (`sicot_ensayo_db_data`), montado en la MISMA ruta que
#     el del archivo base (/var/lib/postgresql). Compose fusiona los volúmenes
#     por ruta de destino: montado en otra ruta, el del archivo base seguía ahí
#     y PostgreSQL 18 no usaba el nuevo.
#
#   - **Puertos distintos, y solo en este equipo** (127.0.0.1: 55432 / 18080 /
#     18443). Puede correr al mismo tiempo que desarrollo, y los datos reales
#     restaurados no quedan expuestos a la red. `!override` porque Compose SUMA
#     las listas de puertos entre archivos: sin él se publicaban también los de
#     desarrollo y chocaba con ellos.
#
#   - **Nombres de contenedor con sufijo `-ensayo`**. Para que `docker ps` deje
#     obvio cuál es cuál. Un `docker exec sicot-db ...` ejecutado contra el
#     entorno equivocado es un error caro y silencioso.
#
# NO ES UN SERVIDOR. La recomendación del arquitecto era literal: «no hace
# falta un servidor, hace falta un lugar donde una migración pueda salir mal
# sin consecuencias».
# ═══════════════════════════════════════════════════════════════════════════

name: sicot-ensayo

services:
  db:
    container_name: sicot-ensayo-db
    ports: !override
      - "127.0.0.1:55432:5432"
    volumes: !override
      - sicot_ensayo_db_data:/var/lib/postgresql

  backend:
    container_name: sicot-ensayo-backend
    ports: !override
      - "127.0.0.1:18080:8080"
    environment:
      # Perfil "prod" a propósito: el ensayo debe parecerse a producción, no a
      # desarrollo. Eso incluye NO sembrar las cuentas de prueba conocidas,
      # exigir un secreto de sesión real y crear el administrador inicial si la
      # base está vacía, que es precisamente uno de los pasos que conviene haber
      # ensayado antes de hacerlo en serio.
      SPRING_PROFILES_ACTIVE: prod
      # Obligatorio con "prod": sin él, el backend no arrancaba nunca. Uno
      # propio del ensayo (paso 0) y no el de desarrollo, que está publicado en
      # el repositorio y aquí habría datos reales.
      JWT_SECRET: ${ENSAYO_JWT_SECRET:?Defina ENSAYO_JWT_SECRET en el .env (paso 0 de la cabecera de docker-compose.ensayo.yml) — genérelo con `openssl rand -base64 48`}
      CORS_ALLOWED_ORIGINS: http://localhost:18443,http://127.0.0.1:18443
      SICOT_ADMIN_EMAIL: ${SICOT_ADMIN_EMAIL:-ensayo@sena.edu.co}
      SICOT_ADMIN_PASSWORD: ${SICOT_ADMIN_PASSWORD:-clave-solo-de-ensayo-1234}

  frontend:
    container_name: sicot-ensayo-frontend
    build:
      args:
        VITE_API_URL: http://localhost:18080
    environment:
      # La SPA llama al backend del ensayo, en 18080. La CSP del archivo base
      # solo permitía el 8080 de desarrollo, y el navegador bloqueaba todas las
      # llamadas de la interfaz.
      CSP_CONNECT_SRC_EXTRA: http://localhost:18080 http://127.0.0.1:18080
    ports: !override
      - "127.0.0.1:18443:8443"

  # Adminer no se expone en el ensayo: si hace falta inspeccionar la base, se
  # entra por `docker exec`. Un panel de base de datos más en otro puerto es
  # una confusión adicional sin beneficio.
  adminer:
    profiles:
      - no-usar-en-ensayo

volumes:
  sicot_ensayo_db_data:
