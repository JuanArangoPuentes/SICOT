# ═══════════════════════════════════════════════════════════════════════════
# SICOT — orquestación local con Docker Desktop
#
#   docker compose up -d --build     levanta los 4 contenedores
#   docker compose ps                 ver estado/salud de cada uno
#   docker compose logs -f backend    seguir logs de un servicio
#   docker compose down               apagar (agregar -v para borrar la BD)
#
# Copie .env.example a .env en esta misma carpeta para sobrescribir los
# valores de desarrollo por defecto (contraseñas, JWT_SECRET, etc.).
# ═══════════════════════════════════════════════════════════════════════════
name: sicot

services:
  db:
    image: postgres:18-alpine
    container_name: sicot-db
    labels:
      org.opencontainers.image.title: "SICOT · PostgreSQL"
      org.opencontainers.image.description: "Base de datos 'sicot' (esquema gestionado por Flyway desde el backend)"
    environment:
      POSTGRES_DB: sicot
      POSTGRES_USER: sicot
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sicot_dev_password}
    volumes:
      # PostgreSQL 18 stores data below this parent directory using a
      # major-version-specific subdirectory.
      - sicot_db_data:/var/lib/postgresql
    ports:
      # 5433 en el host para no chocar con un PostgreSQL nativo ya corriendo
      # en 5432 (como el que usa el flujo de desarrollo sin Docker).
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sicot -d sicot"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  adminer:
    image: adminer:4
    container_name: sicot-adminer
    labels:
      org.opencontainers.image.title: "SICOT · Panel PostgreSQL"
      org.opencontainers.image.description: "Adminer — explorar tablas/datos de la BD 'sicot' desde el navegador"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Precarga el campo "Servidor" del login de Adminer con el nombre del
      # servicio de Docker (resuelto por la red interna de compose).
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  backend:
    build: ./backend
    container_name: sicot-backend
    labels:
      org.opencontainers.image.title: "SICOT · Backend"
      org.opencontainers.image.description: "API Spring Boot (JWT) — Swagger en /swagger-ui.html"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # "dev" siembra los usuarios de prueba (contraseñas conocidas). En el
      # servidor remoto de producción, fije SPRING_PROFILES_ACTIVE=prod (o
      # cualquier valor distinto de "dev") en el .env de la raíz.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://db:5432/sicot
      DB_USERNAME: sicot
      DB_PASSWORD: ${DB_PASSWORD:-sicot_dev_password}
      # JWT_SECRET NO se define aquí a propósito, y no debe volver a definirse
      # con un valor por defecto. El perfil "dev" ya trae un secreto de
      # conveniencia en application-dev.properties; cualquier otro perfil exige
      # JWT_SECRET real en el entorno o el backend rehúsa arrancar
      # (application.properties lo declara sin respaldo, deliberadamente).
      # Ponerle un default aquí anula esa protección: Compose inyectaría la
      # variable pase lo que pase, el respaldo de Spring nunca se activaría, y
      # un despliegue de producción firmaría tokens con una clave publicada en
      # este repositorio. Tampoco sirve `${JWT_SECRET:-}`: una variable definida
      # pero vacía también desactiva el respaldo. Si se define, se hereda del
      # .env, que es lo correcto. Ver docker-compose.prod.yml, donde además pasa
      # a ser obligatoria.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8443,http://127.0.0.1:8443}
      # Administrador inicial — solo se usa en un despliegue con perfil distinto
      # de "dev" y solo si la tabla de usuarios está vacía. En desarrollo no
      # hacen falta: las cuentas de prueba las siembra DataInitializer. Ver
      # AdministradorInicial y docker-compose.prod.yml, donde pasan a ser
      # obligatorias.
      SICOT_ADMIN_EMAIL: ${SICOT_ADMIN_EMAIL:-}
      SICOT_ADMIN_PASSWORD: ${SICOT_ADMIN_PASSWORD:-}
      SICOT_ADMIN_NOMBRE: ${SICOT_ADMIN_NOMBRE:-Administrador SICOT}
      # Correo real (entrega de credenciales) — sin esto configurado en el .env
      # de la raíz, el envío falla honestamente en vez de fingir éxito.
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Ollama corre en el HOST (no en un contenedor propio — necesitaría GPU
      # pasada al contenedor, mucho más complejo). "localhost" desde dentro
      # del contenedor apunta al contenedor mismo, así que se usa el nombre
      # especial que Docker resuelve al host. extra_hosts de abajo es lo que
      # hace que ese nombre funcione también en Docker nativo de Linux (en
      # Docker Desktop de Windows/Mac ya funciona sin eso).
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  frontend:
    build:
      context: ./frontend
      args:
        # El navegador del usuario llama a esta URL directamente, por eso debe
        # ser la URL alcanzable desde el host (no el nombre del servicio interno).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: sicot-frontend
    labels:
      org.opencontainers.image.title: "SICOT · Frontend"
      org.opencontainers.image.description: "UI React servida por nginx — http://localhost:8443"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8443:8443"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8443/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  sicot_db_data:
