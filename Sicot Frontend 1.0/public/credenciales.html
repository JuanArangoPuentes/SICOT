<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>SICOT — Credenciales de acceso</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root {
    --bg-base: #FFFFFF;
    --bg-card: #F4FAF5;
    --bg-surface: #EAF4EC;
    --border: #C2DCC6;
    --accent: #39B54A;
    --accent-emphasis: #2C9A3C;
    --accent-soft: rgba(57, 181, 74, 0.08);
    --accent-line: rgba(57, 181, 74, 0.22);
    --accent-glow: rgba(57, 181, 74, 0.16);
    --text-primary: #0C1A0E;
    --text-secondary: #3A6641;
    --text-muted: #7AAB80;
    --alert-critica: #C83030;
    --font-display: 'Space Grotesk', system-ui, sans-serif;
    --font-ui: 'IBM Plex Sans', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background:
      radial-gradient(circle at 50% 0%, var(--accent-glow), transparent 55%),
      var(--bg-base);
    font-family: var(--font-ui);
    color: var(--text-primary);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 28px 16px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--bg-base);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 18px 48px rgba(12, 26, 14, 0.10);
    padding: 28px 26px 24px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    border-radius: 9px;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 1px var(--accent-line), 0 4px 14px var(--accent-glow);
  }

  .brand-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: -0.01em;
    line-height: 1.15;
  }

  .brand-sub {
    font-size: 9.5px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    line-height: 1.3;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 19px;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }

  .lead {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0 0 20px;
    line-height: 1.5;
  }

  .field {
    margin-bottom: 12px;
  }

  .field-label {
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 3px;
  }

  .field-value {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .pw-block {
    margin: 18px 0 16px;
    padding: 14px 16px;
    background: var(--bg-card);
    border: 1px solid var(--accent-line);
    border-radius: 12px;
  }

  .pw-label {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent-emphasis);
    margin-bottom: 6px;
  }

  .pw-value {
    font-family: var(--font-mono);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--text-primary);
    word-break: break-all;
    user-select: all;
  }

  .copy-btn {
    margin-top: 12px;
    width: 100%;
    padding: 10px 0;
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    color: #ffffff;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 160ms ease;
  }

  .copy-btn:hover { background: var(--accent-emphasis); }
  .copy-btn:active { transform: translateY(1px); }

  .notice {
    display: flex;
    gap: 9px;
    padding: 11px 13px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-secondary);
  }

  .notice svg { flex-shrink: 0; margin-top: 1px; }

  .footer {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 10.5px;
    color: var(--text-muted);
    line-height: 1.6;
    text-align: center;
  }

  .error-icon { color: var(--alert-critica); }

  .center { text-align: center; }

  @media (prefers-color-scheme: dark) {
    html, body {
      background:
        radial-gradient(circle at 50% 0%, rgba(57, 181, 74, 0.12), transparent 55%),
        #0C1A0E;
    }
    :root {
      --bg-base: #0F1F12;
      --bg-card: #14281a;
      --bg-surface: #17301d;
      --border: #234a2b;
      --text-primary: #EAF4EC;
      --text-secondary: #9FCBA6;
      --text-muted: #5E8C66;
    }
  }
</style>
</head>
<body>
  <div id="root" class="card" role="main" aria-live="polite"></div>

  <script>
    function decodePayload() {
      var raw = window.location.hash.slice(1)
      if (!raw) return null
      try { raw = decodeURIComponent(raw) } catch (e) { /* se usa tal cual */ }
      try {
        var binary = atob(raw)
        var bytes = Uint8Array.from(binary, function (c) { return c.charCodeAt(0) })
        var json = new TextDecoder().decode(bytes)
        var data = JSON.parse(json)
        if (!data || !data.correo || !data.password) return null
        return data
      } catch (e) {
        return null
      }
    }

    function fmtFecha(iso) {
      try {
        return new Date(iso).toLocaleString('es-CO', { dateStyle: 'long', timeStyle: 'short' })
      } catch (e) {
        return ''
      }
    }

    function escapeHtml(s) {
      var div = document.createElement('div')
      div.textContent = String(s == null ? '' : s)
      return div.innerHTML
    }

    function renderError() {
      document.getElementById('root').innerHTML = ''
        + '<div class="center" style="padding: 12px 4px;">'
        + '  <svg class="error-icon" width="34" height="34" viewBox="0 0 24 24" fill="none" style="margin: 0 auto 12px;">'
        + '    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/>'
        + '    <path d="M12 8v5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>'
        + '    <circle cx="12" cy="15.6" r="0.9" fill="currentColor"/>'
        + '  </svg>'
        + '  <h1>Enlace no válido</h1>'
        + '  <p class="lead">Este enlace de credenciales está incompleto o no es válido. Solicite un nuevo código QR al administrador del sistema.</p>'
        + '</div>'
    }

    function renderCard(data) {
      var root = document.getElementById('root')
      root.innerHTML = ''
        + '<div class="brand">'
        + '  <div class="brand-mark">'
        + '    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4 10-10" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        + '  </div>'
        + '  <div>'
        + '    <div class="brand-name">SICOT</div>'
        + '    <div class="brand-sub">CTMA · SENA</div>'
        + '  </div>'
        + '</div>'

        + '<h1>Credenciales de acceso</h1>'
        + '<p class="lead">Utilice estos datos para iniciar sesión en el Sistema Inteligente de Gestión y Acompañamiento de Contratos.</p>'

        + (data.nombre ? (
            '<div class="field"><div class="field-label">Nombre</div><div class="field-value">' + escapeHtml(data.nombre) + '</div></div>'
          ) : '')

        + '<div class="field"><div class="field-label">Correo institucional</div><div class="field-value">' + escapeHtml(data.correo) + '</div></div>'

        + (data.rol ? (
            '<div class="field"><div class="field-label">Rol asignado</div><div class="field-value">' + escapeHtml(data.rol) + '</div></div>'
          ) : '')

        + '<div class="pw-block">'
        + '  <div class="pw-label">Contraseña temporal</div>'
        + '  <div class="pw-value" id="pw-value">' + escapeHtml(data.password) + '</div>'
        + '  <button class="copy-btn" id="copy-btn" type="button">Copiar contraseña</button>'
        + '</div>'

        + '<div class="notice">'
        + '  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" style="color: var(--accent-emphasis);"><path d="M12 3l7 3.2v5.3c0 4.6-3 8.9-7 10.5-4-1.6-7-5.9-7-10.5V6.2L12 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.5 12l1.8 1.8 3.2-3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        + '  <span>Esta es una contraseña temporal de un solo uso. Por seguridad, cámbiela al iniciar sesión por primera vez y evite compartir esta página con terceros.</span>'
        + '</div>'

        + '<div class="footer">'
        + (data.generadoEn ? ('Generado el ' + escapeHtml(fmtFecha(data.generadoEn)) + '<br/>') : '')
        + 'Esta página se genera en su dispositivo y no queda almacenada en ningún servidor.<br/>'
        + 'SICOT · Centro Tecnológico del Mobiliario — SENA'
        + '</div>'

      var btn = document.getElementById('copy-btn')
      btn.addEventListener('click', function () {
        var text = data.password
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            btn.textContent = 'Copiado ✓'
            setTimeout(function () { btn.textContent = 'Copiar contraseña' }, 1800)
          }, selectFallback)
        } else {
          selectFallback()
        }
        function selectFallback() {
          var el = document.getElementById('pw-value')
          var range = document.createRange()
          range.selectNodeContents(el)
          var sel = window.getSelection()
          sel.removeAllRanges()
          sel.addRange(range)
          btn.textContent = 'Seleccionada — copie manualmente'
        }
      })
    }

    var payload = decodePayload()
    if (payload) { renderCard(payload) } else { renderError() }
  </script>
</body>
</html>
