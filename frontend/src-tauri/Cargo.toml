[package]
name = "sicot"
version = "0.4.0"
description = "SICOT — Supervision de contratos del Centro Tecnologico del Mobiliario (SENA)"
authors = ["MediaLab — Centro Tecnologico del Mobiliario, SENA"]
license = "MIT"
repository = "https://github.com/JuanArangoPuentes/SICOT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sicot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
