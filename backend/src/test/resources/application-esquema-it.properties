# ═══════════════════════════════════════════════════════════════════════════
# Perfil "esquema-it" — verificación del esquema real contra PostgreSQL.
#
# Lo usa EsquemaPostgreSqlIntegrationTest y NADA más. A diferencia del perfil
# "test" (H2 en memoria, esquema generado por Hibernate, Flyway apagado), aquí
# la relación se invierte y es la que corre en producción:
#
#   - Flyway construye el esquema desde db/migration.
#   - Hibernate NO lo genera: solo lo valida (ddl-auto=validate).
#
# Es la única configuración de pruebas capaz de detectar que una migración y una
# entidad dejaron de decir lo mismo. Con H2 esa comprobación es imposible por
# construcción: el esquema se deriva de las propias entidades, así que siempre
# coincide consigo mismo y las migraciones nunca se ejecutan.
#
# Los datos de conexión NO están aquí: los inyecta el test desde las variables
# de entorno SICOT_IT_DB_URL / SICOT_IT_DB_USERNAME / SICOT_IT_DB_PASSWORD, y
# la prueba se salta entera si no están definidas.
# ═══════════════════════════════════════════════════════════════════════════

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# El punto entero de este perfil.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Secreto de conveniencia: este perfil nunca emite tokens que salgan de la
# prueba, pero el backend exige un JWT_SECRET válido para poder arrancar.
sicot.security.jwt-secret=ZGl2ZWxvcG1lbnQtc2ljb3Qtc2VjcmV0by1qd3Qta2V5LW11eS1sYXJnbzY0LWJ5dGVzLXNlZ3Vybw==
sicot.security.jwt-expiration-ms=28800000
sicot.cors.allowed-origins=http://localhost:5173

logging.level.org.flywaydb=INFO
