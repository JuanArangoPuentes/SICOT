# Perfil de prueba: H2 en memoria (el esquema lo genera Hibernate).
# Las migraciones Flyway/PostgreSQL se validan contra la base real en ejecución.
spring.datasource.url=jdbc:h2:mem:sicot;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.flyway.enabled=false

# Coste de BCrypt reducido SOLO para la suite. Ver SecurityConfig.passwordEncoder:
# las pruebas siembran cuentas y hacen login cientos de veces, y el coste real
# de produccion (10) anadia mas de un minuto sin comprobar nada adicional.
sicot.security.bcrypt-fuerza=4

sicot.security.jwt-secret=ZGl2ZWxvcG1lbnQtc2ljb3Qtc2VjcmV0by1qd3Qta2V5LW11eS1sYXJnbzY0LWJ5dGVzLXNlZ3Vybw==
sicot.security.jwt-expiration-ms=28800000

sicot.cors.allowed-origins=http://localhost:5173

# Motor de automatizaciones apagado en la suite: el planificador no debe
# disparar en mitad de una comprobacion. Los beans siguen existiendo, asi que
# las pruebas invocan MotorDeAutomatizacion y EjecutorDeTareas cuando quieren y
# comprueban el resultado de forma determinista. Ver ADR-008.
sicot.automatizacion.habilitado=false
sicot.automatizacion.sondeo=PT1M
sicot.automatizacion.tamano-del-lote=25
sicot.automatizacion.trabajadores=2
sicot.automatizacion.maximo-de-intentos=3
sicot.automatizacion.espera-base=PT1M
sicot.automatizacion.abandono-tras-ver=PT30M
sicot.automatizacion.dias-de-aviso-previo=30,15,7
sicot.automatizacion.ia.habilitado=false
sicot.automatizacion.ia.dias-del-periodo=7
