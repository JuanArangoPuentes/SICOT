# ═══════════════════════════════════════════════════════════════════════════
# Perfil "prod" — valores explícitos para un despliegue real.
# Se activa fijando SPRING_PROFILES_ACTIVE=prod en el .env del servidor.
# No siembra usuarios de prueba (eso solo ocurre en el perfil "dev", ver
# DataInitializer) y no expone Swagger sin autenticación.
#
# JWT_SECRET sigue sin tener valor de respaldo aquí a propósito: si no se
# define un secreto real en el entorno, el backend rehúsa arrancar en vez de
# usar cualquier valor de conveniencia (ver application.properties).
# ═══════════════════════════════════════════════════════════════════════════

# Swagger exige JWT válido en vez de quedar público (ver SecurityConfig).
sicot.swagger.public=false

# Logging menos verboso que en desarrollo.
logging.level.co.sena.sicot=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# ── Pool de conexiones (HikariCP) ───────────────────────────────────────────
# Hasta ahora el pool quedaba con los valores por defecto de Spring Boot: 10
# conexiones y, lo importante, SIN detección de fugas y con un tiempo de espera
# de 30 s para conseguir una conexión. Una fuga (una conexión que se toma y no
# se devuelve) se manifiesta entonces como una aplicación que responde cada vez
# más lento hasta congelarse por completo, sin una sola línea en el log que
# diga por qué. Estos valores hacen que ese fallo se anuncie en vez de
# esconderse.
spring.datasource.hikari.pool-name=sicot-pool
# 10 conexiones para una aplicación de un solo centro de formación. El límite
# real no es la carga sino max_connections de PostgreSQL (100 por defecto):
# subir esto sin subir aquello traslada el agotamiento del pool al servidor de
# base de datos, donde falla peor.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
# Fallar rápido si el pool está agotado: 10 s en vez de 30. Una petición que
# espera medio minuto por una conexión ya está perdida para el usuario, y
# mientras espera retiene un hilo de Tomcat.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
# Por debajo del wait_timeout típico de un proxy o firewall intermedio, para
# que sea Hikari quien recicle la conexión y no el intermediario quien la corte
# con la aplicación usándola.
spring.datasource.hikari.max-lifetime=1800000
# Avisa en el log si una conexión lleva 30 s prestada. No la cierra: solo deja
# el stack trace de quién la pidió. Es la única forma práctica de encontrar una
# fuga en producción.
spring.datasource.hikari.leak-detection-threshold=30000
# Red de seguridad del lado del servidor: ninguna sentencia puede quedarse
# corriendo indefinidamente reteniendo su conexión. 60 s es holgadísimo para
# este sistema (la consulta más pesada recorre miles de filas, no millones).
# Si alguna vez una migración sobre una tabla muy grande necesitara más, hay
# que elevarlo temporalmente para ese despliegue: Flyway usa este mismo pool.
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '60s'

# ── Salud de la base de datos ───────────────────────────────────────────────
# El healthcheck del contenedor (ver docker-compose.yml) consulta /actuator/health.
# Con el indicador de base de datos activo, ese endpoint deja de responder OK
# cuando PostgreSQL no está alcanzable, y Docker reinicia el backend en vez de
# mantener arriba un contenedor que no puede atender ni una sola petición.
management.health.db.enabled=true
