# ═══════════════════════════════════════════════════════════════════════════
# SICOT Backend — configuración de aplicación
# Todos los secretos provienen de variables de entorno (ver .env.example).
# No coloque credenciales reales en este archivo.
# ═══════════════════════════════════════════════════════════════════════════

spring.application.name=sicot-backend

# Perfil activo — "prod" por defecto, es decir, ARRANQUE FAIL CLOSED.
#
# Aquí decía "dev" por defecto, y esa comodidad era el agujero: `java -jar
# sicot-backend.jar` o `docker compose up` con el archivo base y sin variables
# levantaban un backend que firma tokens con el secreto de conveniencia
# PUBLICADO en este repositorio (application-dev.properties) y que además siembra
# las cuentas demo con contraseñas conocidas (DataInitializer). Nada fallaba:
# arrancaba perfectamente, y esa es justo la forma de fallo peligrosa. Bastaba
# que alguien probara el JAR en una máquina de la red del centro.
#
# Con "prod" por defecto, ese mismo arranque descuidado se DETIENE: el perfil
# prod no tiene respaldo para JWT_SECRET y el backend rehúsa arrancar con un
# mensaje explícito (ver JwtService). Equivocarse ahora cuesta un error al
# arrancar en vez de una clave privada publicada firmando sesiones reales.
#
# El desarrollo local no cambia: `./mvnw spring-boot:run` activa "dev" desde la
# configuración del spring-boot-maven-plugin en el pom, `docker-compose.yml`
# (el archivo de desarrollo) lo pasa explícito, y la suite usa "test". Quien
# quiera "dev" fuera de esos caminos lo declara a mano — que es exactamente lo
# que debe costar.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# ── Base de datos ───────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sicot}
spring.datasource.username=${DB_USERNAME:sicot}
spring.datasource.password=${DB_PASSWORD:sicot_dev_password}

# JPA/Hibernate: el esquema lo controla Flyway, no Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# ── Flyway ──────────────────────────────────────────────────────────────────
# Flyway es el ÚNICO dueño del esquema. Hibernate solo lo valida (ddl-auto
# arriba); ninguna otra herramienta debe crear ni alterar tablas.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
# Las tres garantías siguientes ya son el valor por defecto de Flyway. Se
# declaran explícitamente porque son irreversibles si alguien las cambia sin
# darse cuenta, y un archivo de configuración que las dice en voz alta es más
# difícil de romper que uno que depende de recordar cuál era el default:
#   - clean-disabled: `flyway clean` BORRA todas las tablas del esquema. En
#     producción no hay ningún motivo legítimo para ejecutarlo.
#   - validate-on-migrate: si el contenido de una migración ya aplicada cambió,
#     el arranque falla. Es lo que detecta que el SQL del repositorio y el que
#     realmente se ejecutó en esta base dejaron de coincidir.
#   - out-of-order: una migración con número menor al último aplicado NO se
#     ejecuta a destiempo. Dos ramas que crean V13 en paralelo tienen que
#     resolver el choque antes del despliegue, no después.
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# ── Seguridad / JWT ─────────────────────────────────────────────────────────
# JWT_SECRET: clave HMAC-SHA256 de al menos 32 bytes codificada en Base64.
# Se declara con respaldo VACÍO, no sin respaldo. La diferencia es sólo el
# mensaje de error: sin respaldo, Spring aborta con "Could not resolve
# placeholder 'JWT_SECRET'", que no le dice a quien despliega ni qué variable
# falta ni qué formato espera. Con respaldo vacío, la comprobación cae en
# JwtService, que explica las dos cosas y cómo generar una clave válida.
# En ambos casos el backend se niega a arrancar; sigue sin haber ningún valor
# de conveniencia fuera de "dev" y "test".
sicot.security.jwt-secret=${JWT_SECRET:}
# Duración del token en milisegundos (8 horas por defecto).
sicot.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:28800000}

# ── Administrador inicial (solo primer arranque) ────────────────────────────
# Con la tabla `usuarios` vacía y un perfil distinto de dev/test, el backend
# crea esta única cuenta ADMINISTRADOR y con ella se administra todo lo demás.
# Sin estas variables el despliegue sería inaccesible, así que el arranque falla
# con un mensaje explícito en vez de quedarse en pie sin que nadie pueda entrar
# (ver AdministradorInicial). Una vez creada la cuenta pueden retirarse: no
# vuelven a usarse mientras exista al menos un usuario.
sicot.bootstrap.admin-email=${SICOT_ADMIN_EMAIL:}
sicot.bootstrap.admin-password=${SICOT_ADMIN_PASSWORD:}
sicot.bootstrap.admin-nombre=${SICOT_ADMIN_NOMBRE:Administrador SICOT}

# ── CORS (desarrollo) ───────────────────────────────────────────────────────
# Orígenes permitidos separados por coma. En producción restringir a los oficiales.
sicot.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8443,http://127.0.0.1:8443}

# ── Correo (entrega real de credenciales) ───────────────────────────────────
# Si MAIL_USERNAME queda vacío, el envío falla honestamente (ver EmailService)
# en vez de fingir que se mandó el correo.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# STARTTLS obligatorio: sin esto, `starttls.enable` sólo lo INTENTA. Un
# intermediario que borre la capacidad STARTTLS del saludo del servidor hace que
# JavaMail siga en claro sin avisar, y por ahí viajan la contraseña de la cuenta
# y las credenciales que SICOT manda a los supervisores.
spring.mail.properties.mail.smtp.starttls.required=true
# Verificación del nombre del certificado. Se declara explícitamente en vez de
# confiar en el valor por defecto de la librería: es un control que se pierde en
# silencio —la conexión sigue cifrada y funcionando, sólo que contra cualquiera
# que presente un certificado válido de otro nombre— y su ausencia no produce
# ningún síntoma que alguien vaya a notar. Cubre además CVE-2026-40992, donde la
# autoconfiguración de correo de Spring Boot no activaba esta comprobación.
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
# Tiempos de espera obligatorios: sin ellos JavaMail espera INDEFINIDAMENTE si
# el servidor de correo no responde. Un envío colgado retiene un hilo de Tomcat,
# y con unos pocos simultáneos se degrada toda la aplicación, no solo el correo.
# 10 s es de sobra para un SMTP sano y falla rápido cuando no lo está.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
sicot.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# ── OpenAPI / Swagger ───────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
# Público por defecto (dev). El perfil "prod" lo fija en false — ver
# application-prod.properties y SecurityConfig.
sicot.swagger.public=true

# ── Actuator ────────────────────────────────────────────────────────────────
# `metrics` y `prometheus` se suman a health/info para que exista algo que
# mirar cuando el sistema se degrade: uso de memoria, hilos de Tomcat, pool de
# Hikari, latencia por endpoint. Solo /actuator/health es público (ver
# SecurityConfig); los demás exigen JWT, así que exponerlos no abre nada.
# Semgrep avisa de que hay actuadores distintos de `health` expuestos. Es cierto
# y es deliberado: "expuesto" aquí significa registrado en el mapa de rutas, no
# accesible sin credenciales. SecurityConfig deja público únicamente
# /actuator/health —el que consulta el healthcheck del contenedor— y exige JWT
# para todo lo demás. `metrics` y `prometheus` son lo único que permite saber
# POR QUÉ se degradó el sistema (memoria, hilos de Tomcat, pool de Hikari,
# latencia por endpoint) en vez de sólo que se cayó, y quitarlos dejaría la
# operación a ciegas sin cerrar nada que hoy esté abierto.
# nosemgrep: java.spring.security.audit.spring-actuator-non-health-enabled.spring-actuator-dangerous-endpoints-enabled
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
# Etiqueta común en todas las métricas: sin ella, dos despliegues que reporten
# al mismo Prometheus quedan mezclados en la misma serie.
management.metrics.tags.application=${spring.application.name}
# Percentiles por endpoint HTTP. El promedio esconde justo el caso que importa:
# una mediana sana con un p99 de varios segundos se ve igual que todo bien.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# El correo es una integración opcional (ver EmailService: falla honesto si no
# está configurado). No debe tumbar el healthcheck general de la aplicación.
management.health.mail.enabled=false

# ── Umbral de almacenamiento de documentos ─────────────────────────────────
# A partir de este tamaño de la tabla `documentos`, conviene sacar los archivos
# de PostgreSQL hacia almacenamiento de objetos. Ver docs/decisiones/ADR-003:
# no es un límite del motor (aguanta mucho más) sino el punto donde restaurar
# deja de caber en el tiempo de recuperación comprometido en ADR-002.
# VigilanciaDeAlmacenamiento avisa en el log al 80% y publica la métrica
# `sicot.almacenamiento.documentos.bytes` en /actuator/metrics.
sicot.almacenamiento.umbral-gb=${ALMACENAMIENTO_UMBRAL_GB:5}

# ── Carga de archivos (catálogo de formatos documentales) ──────────────────
# 20 MB, el mismo tope que valida ArchivoValidator.TAMANIO_MAXIMO_BYTES. Antes
# aquí decía 25 MB: un archivo de 22 MB se recibía entero en memoria y solo
# después lo rechazaba el validador, pagando el costo de la subida para no
# quedarse con nada. Si cambia uno de los dos valores, cambie el otro.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ── IA local (Ollama) ───────────────────────────────────────────────────────
# Servidor Ollama corriendo localmente — sin costos de licencia ni por consumo
# (ver regla "gratuito y sin límite de uso" del proyecto). El frontend nunca
# llama a Ollama directamente: siempre pasa por este backend.
sicot.ia.ollama-url=${OLLAMA_URL:http://localhost:11434}
# Variante *instruct* de proposito general, NO la afinada para codigo. SICOT no
# genera codigo con la IA: redacta documentos en espanol administrativo, extrae
# datos de PDF y conversa con el supervisor. Ver docs/decisiones/ADR-006.
# Misma familia y mismo tamano que el anterior (qwen2.5-coder:7b), asi que no
# cambia el requisito de memoria ni hay que revalidar el hardware.
sicot.ia.ollama-model=${OLLAMA_MODEL:qwen2.5:7b}
# 180 s y no 900. Cada llamada retiene un hilo de Tomcat mientras espera, y esos
# hilos los comparte toda la aplicación: quince minutos de espera por petición
# convertían un pico de uso del copiloto en una caída del sistema completo.
# Tres minutos es holgado para un modelo de 7B en CPU y sigue siendo mucho más
# de lo que un usuario espera frente a la pantalla.
sicot.ia.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:180}
# Techos de uso — ver LimitadorDeUsoIa. La concurrencia es baja a propósito:
# Ollama atiende un modelo casi en serie, así que admitir más peticiones a la
# vez no las acelera, solo hace esperar a más hilos de Tomcat.
sicot.ia.max-concurrentes=${OLLAMA_MAX_CONCURRENTES:2}
sicot.ia.peticiones-por-minuto=${OLLAMA_PETICIONES_POR_MINUTO:10}

# ── Motor de automatizaciones ──────────────────────────────────────────────
# Reglas que generan alertas y avisos sin que nadie las dispare a mano.
# Ver docs/decisiones/ADR-008: viven dentro del backend, no en n8n ni en un
# proceso aparte, porque son logica de negocio y tienen que entrar por PR.
#
# En false el sistema entero sigue funcionando: simplemente no se generan
# automatizaciones. La suite de pruebas lo apaga para que ningun temporizador
# dispare en mitad de una comprobacion.
sicot.automatizacion.habilitado=${AUTOMATIZACION_HABILITADA:true}
# Cada cuanto se mira la cola. Un minuto es holgado: estas automatizaciones
# avisan de cosas que se miden en dias, no en segundos. fixedDelay, asi que
# cuenta desde que TERMINA la ronda anterior y dos rondas nunca se solapan.
sicot.automatizacion.sondeo=${AUTOMATIZACION_SONDEO:PT1M}
# Tareas por ronda. Acotado para que una acumulacion de miles no se intente
# procesar de una sola vez.
sicot.automatizacion.tamano-del-lote=${AUTOMATIZACION_LOTE:25}
# Hilos propios del motor, NO los de Tomcat (misma leccion que LimitadorDeUsoIa:
# una tarea lenta que retiene un hilo compartido acaba tumbando los logins).
# Pequeno a proposito: el trabajo es de espera y comparte base y modelo con los
# usuarios.
sicot.automatizacion.trabajadores=${AUTOMATIZACION_TRABAJADORES:2}
# Reintentos con espera exponencial (base x 2^intentos) antes de rendirse.
sicot.automatizacion.maximo-de-intentos=${AUTOMATIZACION_MAX_INTENTOS:5}
sicot.automatizacion.espera-base=${AUTOMATIZACION_ESPERA_BASE:PT1M}
# Desde cuando se considera abandonada una tarea que quedo EN_PROCESO. Cubre el
# caso de matar el backend a mitad de una ejecucion: sin esto, esa tarea no la
# reclama nadie nunca mas.
sicot.automatizacion.abandono-tras-ver=${AUTOMATIZACION_ABANDONO:PT30M}
# Cuanto se conservan las tareas ya resueltas antes de purgarlas (05:00 diario).
# Solo COMPLETADA y DESCARTADA: una FALLIDA es evidencia de un problema y se
# queda hasta que alguien la mire. Sin esto la tabla crece de forma monotona,
# y ADR-003 ya establecio que el tamano de la base determina si la restauracion
# cabe en el RTO de 4 h de ADR-002.
sicot.automatizacion.retencion-de-tareas=${AUTOMATIZACION_RETENCION:P30D}
# Umbrales de aviso previo al vencimiento, en dias. Uno por alerta: 30, 15 y 7
# producen TRES avisos y no treinta, porque la clave de idempotencia incluye el
# umbral y no la fecha.
sicot.automatizacion.dias-de-aviso-previo=${AUTOMATIZACION_DIAS_AVISO:30,15,7}

# Carril de IA. APAGADO por defecto a proposito: generar prosa sin que nadie la
# haya pedido, en un sistema de contratacion publica, es una decision de quien
# despliega y no un valor que aparezca solo tras un git pull. Con esto en false
# el bean de la regla ni siquiera se crea.
sicot.automatizacion.ia.habilitado=${AUTOMATIZACION_IA_HABILITADA:false}
sicot.automatizacion.ia.dias-del-periodo=${AUTOMATIZACION_IA_DIAS:7}

# ── Vigilancia del respaldo ────────────────────────────────────────────────
# ADR-002 compromete un RPO de 24 h apoyado en scripts/respaldo-sicot.sh
# ejecutado por cron a las 02:00. Ese cron NO lo instala este repositorio: lo
# pone quien despliega, en el servidor, a mano. Un paso manual escrito en un
# documento no es un control (la leccion de ADR-006), asi que el sistema
# comprueba a diario que el respaldo exista y no sea mas viejo que el RPO.
#
# Apuntar al directorio donde escribe el script. Vacio = sin vigilancia, y el
# arranque avisa de que el compromiso de ADR-002 esta sin verificar.
sicot.respaldo.directorio=${RESPALDO_DIRECTORIO:}
sicot.respaldo.rpo-horas=${RESPALDO_RPO_HORAS:24}
# Metrica publicada: sicot.respaldo.antiguedad.horas (-1 = no se pudo determinar)

# ── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/

# ── Logging ─────────────────────────────────────────────────────────────────
logging.level.co.sena.sicot=INFO
logging.level.org.hibernate.SQL=WARN
# Identificador de petición en cada línea (ver CorrelacionDeSolicitudFilter).
# Es lo que permite reconstruir "qué pasó con esta petición" en un log donde las
# líneas de distintos usuarios llegan entremezcladas. El `%X{requestId:-}` deja
# el hueco vacío en las líneas de arranque, que no pertenecen a ninguna petición.
logging.pattern.level=%5p [%X{requestId:-}]

# ── Autoconfiguración que sobra ─────────────────────────────────────────────
# Sin esto, Spring Boot ve que no hay ningún UserDetailsService (la
# autenticación la resuelve por completo JwtAuthenticationFilter contra la
# tabla `usuarios`) y crea uno en memoria con una contraseña aleatoria,
# anunciándola en cada arranque con "Using generated security password... your
# security configuration must be updated before running in production". Ese
# usuario es inalcanzable —no hay formLogin ni httpBasic en la cadena de
# filtros— pero el mensaje aparece en los logs de producción y hace pensar que
# la configuración de seguridad está sin terminar.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
