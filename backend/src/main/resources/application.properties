# ═══════════════════════════════════════════════════════════════════════════
# SICOT Backend — configuración de aplicación
# Todos los secretos provienen de variables de entorno (ver .env.example).
# No coloque credenciales reales en este archivo.
# ═══════════════════════════════════════════════════════════════════════════

spring.application.name=sicot-backend

# Perfil activo — "dev" por defecto (siembra los usuarios de prueba del
# README). El servidor remoto de producción DEBE fijar SPRING_PROFILES_ACTIVE
# a cualquier otro valor (p. ej. "prod") en su .env para que DataInitializer
# nunca cree esas cuentas conocidas ahí.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ── Base de datos ───────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sicot}
spring.datasource.username=${DB_USERNAME:sicot}
spring.datasource.password=${DB_PASSWORD:sicot_dev_password}

# JPA/Hibernate: el esquema lo controla Flyway, no Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# ── Flyway ──────────────────────────────────────────────────────────────────
# Flyway es el ÚNICO dueño del esquema. Hibernate solo lo valida (ddl-auto
# arriba); ninguna otra herramienta debe crear ni alterar tablas.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
# Las tres garantías siguientes ya son el valor por defecto de Flyway. Se
# declaran explícitamente porque son irreversibles si alguien las cambia sin
# darse cuenta, y un archivo de configuración que las dice en voz alta es más
# difícil de romper que uno que depende de recordar cuál era el default:
#   - clean-disabled: `flyway clean` BORRA todas las tablas del esquema. En
#     producción no hay ningún motivo legítimo para ejecutarlo.
#   - validate-on-migrate: si el contenido de una migración ya aplicada cambió,
#     el arranque falla. Es lo que detecta que el SQL del repositorio y el que
#     realmente se ejecutó en esta base dejaron de coincidir.
#   - out-of-order: una migración con número menor al último aplicado NO se
#     ejecuta a destiempo. Dos ramas que crean V13 en paralelo tienen que
#     resolver el choque antes del despliegue, no después.
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# ── Seguridad / JWT ─────────────────────────────────────────────────────────
# JWT_SECRET: clave HMAC-SHA256 de al menos 32 bytes codificada en Base64.
# Sin valor de respaldo aquí a propósito: el único perfil con un secreto de
# conveniencia conocido es "dev" (ver application-dev.properties). Cualquier
# otro perfil (p. ej. "prod") exige JWT_SECRET real en el entorno o el
# arranque falla — así nunca se firma un token con la clave pública del repo.
sicot.security.jwt-secret=${JWT_SECRET}
# Duración del token en milisegundos (8 horas por defecto).
sicot.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:28800000}

# ── Administrador inicial (solo primer arranque) ────────────────────────────
# Con la tabla `usuarios` vacía y un perfil distinto de dev/test, el backend
# crea esta única cuenta ADMINISTRADOR y con ella se administra todo lo demás.
# Sin estas variables el despliegue sería inaccesible, así que el arranque falla
# con un mensaje explícito en vez de quedarse en pie sin que nadie pueda entrar
# (ver AdministradorInicial). Una vez creada la cuenta pueden retirarse: no
# vuelven a usarse mientras exista al menos un usuario.
sicot.bootstrap.admin-email=${SICOT_ADMIN_EMAIL:}
sicot.bootstrap.admin-password=${SICOT_ADMIN_PASSWORD:}
sicot.bootstrap.admin-nombre=${SICOT_ADMIN_NOMBRE:Administrador SICOT}

# ── CORS (desarrollo) ───────────────────────────────────────────────────────
# Orígenes permitidos separados por coma. En producción restringir a los oficiales.
sicot.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8443,http://127.0.0.1:8443}

# ── Correo (entrega real de credenciales) ───────────────────────────────────
# Si MAIL_USERNAME queda vacío, el envío falla honestamente (ver EmailService)
# en vez de fingir que se mandó el correo.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Tiempos de espera obligatorios: sin ellos JavaMail espera INDEFINIDAMENTE si
# el servidor de correo no responde. Un envío colgado retiene un hilo de Tomcat,
# y con unos pocos simultáneos se degrada toda la aplicación, no solo el correo.
# 10 s es de sobra para un SMTP sano y falla rápido cuando no lo está.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
sicot.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# ── OpenAPI / Swagger ───────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
# Público por defecto (dev). El perfil "prod" lo fija en false — ver
# application-prod.properties y SecurityConfig.
sicot.swagger.public=true

# ── Actuator ────────────────────────────────────────────────────────────────
# `metrics` y `prometheus` se suman a health/info para que exista algo que
# mirar cuando el sistema se degrade: uso de memoria, hilos de Tomcat, pool de
# Hikari, latencia por endpoint. Solo /actuator/health es público (ver
# SecurityConfig); los demás exigen JWT, así que exponerlos no abre nada.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
# Etiqueta común en todas las métricas: sin ella, dos despliegues que reporten
# al mismo Prometheus quedan mezclados en la misma serie.
management.metrics.tags.application=${spring.application.name}
# Percentiles por endpoint HTTP. El promedio esconde justo el caso que importa:
# una mediana sana con un p99 de varios segundos se ve igual que todo bien.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# El correo es una integración opcional (ver EmailService: falla honesto si no
# está configurado). No debe tumbar el healthcheck general de la aplicación.
management.health.mail.enabled=false

# ── Carga de archivos (catálogo de formatos documentales) ──────────────────
# 20 MB, el mismo tope que valida ArchivoValidator.TAMANIO_MAXIMO_BYTES. Antes
# aquí decía 25 MB: un archivo de 22 MB se recibía entero en memoria y solo
# después lo rechazaba el validador, pagando el costo de la subida para no
# quedarse con nada. Si cambia uno de los dos valores, cambie el otro.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ── IA local (Ollama) ───────────────────────────────────────────────────────
# Servidor Ollama corriendo localmente — sin costos de licencia ni por consumo
# (ver regla "gratuito y sin límite de uso" del proyecto). El frontend nunca
# llama a Ollama directamente: siempre pasa por este backend.
sicot.ia.ollama-url=${OLLAMA_URL:http://localhost:11434}
sicot.ia.ollama-model=${OLLAMA_MODEL:qwen2.5-coder:7b}
# 180 s y no 900. Cada llamada retiene un hilo de Tomcat mientras espera, y esos
# hilos los comparte toda la aplicación: quince minutos de espera por petición
# convertían un pico de uso del copiloto en una caída del sistema completo.
# Tres minutos es holgado para un modelo de 7B en CPU y sigue siendo mucho más
# de lo que un usuario espera frente a la pantalla.
sicot.ia.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:180}
# Techos de uso — ver LimitadorDeUsoIa. La concurrencia es baja a propósito:
# Ollama atiende un modelo casi en serie, así que admitir más peticiones a la
# vez no las acelera, solo hace esperar a más hilos de Tomcat.
sicot.ia.max-concurrentes=${OLLAMA_MAX_CONCURRENTES:2}
sicot.ia.peticiones-por-minuto=${OLLAMA_PETICIONES_POR_MINUTO:10}

# ── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/

# ── Logging ─────────────────────────────────────────────────────────────────
logging.level.co.sena.sicot=INFO
logging.level.org.hibernate.SQL=WARN
# Identificador de petición en cada línea (ver CorrelacionDeSolicitudFilter).
# Es lo que permite reconstruir "qué pasó con esta petición" en un log donde las
# líneas de distintos usuarios llegan entremezcladas. El `%X{requestId:-}` deja
# el hueco vacío en las líneas de arranque, que no pertenecen a ninguna petición.
logging.pattern.level=%5p [%X{requestId:-}]

# ── Autoconfiguración que sobra ─────────────────────────────────────────────
# Sin esto, Spring Boot ve que no hay ningún UserDetailsService (la
# autenticación la resuelve por completo JwtAuthenticationFilter contra la
# tabla `usuarios`) y crea uno en memoria con una contraseña aleatoria,
# anunciándola en cada arranque con "Using generated security password... your
# security configuration must be updated before running in production". Ese
# usuario es inalcanzable —no hay formLogin ni httpBasic en la cadena de
# filtros— pero el mensaje aparece en los logs de producción y hace pensar que
# la configuración de seguridad está sin terminar.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
