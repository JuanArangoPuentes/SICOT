# Perfil "dev" — valores de conveniencia SOLO para desarrollo local.
#
# Este archivo únicamente se carga cuando el perfil "dev" está activo, y "dev"
# YA NO ES EL VALOR POR DEFECTO: desde ADR-011 lo es "prod". Aquí decía lo
# contrario, y esa era justo la puerta — un arranque que olvidara declarar el
# perfil caía en éste y firmaba tokens reales con el secreto de abajo, que está
# publicado en un repositorio público.
#
# Hoy, para llegar a este archivo hay que pedirlo: lo hacen `./mvnw
# spring-boot:run` (desde el pom) y `docker compose up` con el archivo base. Un
# despliegue que no diga nada no cae aquí: se detiene, porque JWT_SECRET no
# tiene respaldo fuera de este perfil y JwtService lo exige.
# ═══════════════════════════════════════════════════════════════════════════
