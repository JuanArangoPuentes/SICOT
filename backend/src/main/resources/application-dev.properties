# ═══════════════════════════════════════════════════════════════════════════
# Perfil "dev" — valores de conveniencia SOLO para desarrollo local.
#
# Este archivo únicamente se carga cuando el perfil "dev" está activo, y "dev"
# YA NO ES EL VALOR POR DEFECTO: desde ADR-011 lo es "prod". Aquí decía lo
# contrario, y esa era justo la puerta — un arranque que olvidara declarar el
# perfil caía en éste y firmaba tokens reales con el secreto de abajo, que está
# publicado en un repositorio público.
#
# Hoy, para llegar a este archivo hay que pedirlo: lo hacen `./mvnw
# spring-boot:run` (desde el pom) y `docker compose up` con el archivo base. Un
# despliegue que no diga nada no cae aquí: se detiene, porque JWT_SECRET no
# tiene respaldo fuera de este perfil y JwtService lo exige.
# ═══════════════════════════════════════════════════════════════════════════
sicot.security.jwt-secret=${JWT_SECRET:ZGl2ZWxvcG1lbnQtc2ljb3Qtc2VjcmV0by1qd3Qta2V5LW11eS1sYXJnbzY0LWJ5dGVzLXNlZ3Vybw==}

# ── Flyway con una base compartida entre ramas ──────────────────────────────
# La base de desarrollo la usan varias ramas a la vez. El 15-10-2026 tenía
# aplicada la V19 de integracion/auditoria-2-oct, que las demás ramas no
# tienen, y el backend de esas ramas no arrancaba: Flyway valida que toda
# migración aplicada exista en el código. En desarrollo eso no indica nada
# grave y se tolera. En producción NO: allí una migración aplicada que el
# código no conoce significa que se desplegó la versión equivocada, y debe
# detener el arranque. Por eso vive en este perfil y en ningún otro.
spring.flyway.ignore-migration-patterns=*:missing,*:future
