# ═══════════════════════════════════════════════════════════════════════════
# SICOT Backend — configuración de aplicación
# Todos los secretos provienen de variables de entorno (ver .env.example).
# No coloque credenciales reales en este archivo.
# ═══════════════════════════════════════════════════════════════════════════

spring.application.name=sicot-backend

# ── Base de datos ───────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sicot}
spring.datasource.username=${DB_USERNAME:sicot}
spring.datasource.password=${DB_PASSWORD:sicot_dev_password}

# JPA/Hibernate: el esquema lo controla Flyway, no Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# ── Flyway ──────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ── Seguridad / JWT ─────────────────────────────────────────────────────────
# JWT_SECRET: clave HMAC-SHA256 de al menos 32 bytes codificada en Base64.
sicot.security.jwt-secret=${JWT_SECRET:ZGl2ZWxvcG1lbnQtc2ljb3Qtc2VjcmV0by1qd3Qta2V5LW11eS1sYXJnbzY0LWJ5dGVzLXNlZ3Vybw==}
# Duración del token en milisegundos (8 horas por defecto).
sicot.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:28800000}

# ── CORS (desarrollo) ───────────────────────────────────────────────────────
# Orígenes permitidos separados por coma. En producción restringir a los oficiales.
sicot.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8443,http://127.0.0.1:8443}

# ── Correo (entrega real de credenciales) ───────────────────────────────────
# Si MAIL_USERNAME queda vacío, el envío falla honestamente (ver EmailService)
# en vez de fingir que se mandó el correo.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
sicot.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

# ── SMS (entrega real de credenciales, Twilio) ──────────────────────────────
# Si TWILIO_ACCOUNT_SID queda vacío, el envío falla honestamente (ver SmsService).
sicot.sms.account-sid=${TWILIO_ACCOUNT_SID:}
sicot.sms.auth-token=${TWILIO_AUTH_TOKEN:}
sicot.sms.from-number=${TWILIO_FROM_NUMBER:}

# ── OpenAPI / Swagger ───────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ── Actuator ────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ── Carga de archivos (catálogo de formatos documentales) ──────────────────
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ── Server ──────────────────────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/

# ── Logging ─────────────────────────────────────────────────────────────────
logging.level.co.sena.sicot=INFO
logging.level.org.hibernate.SQL=WARN
