name: Publicar APK

# Compila el APK de publicación FIRMADO y lo adjunta a una versión de GitHub,
# junto al instalador de escritorio (ADR-013).
#
# Cuándo corre: al publicar una versión en GitHub, o a mano indicando la
# etiqueta. Es el ÚNICO flujo que ve la llave de firma; `android.yml` compila en
# depuración y no necesita ningún secreto. Un PR no puede dispararlo, y los
# secretos no se entregan a flujos lanzados desde bifurcaciones.
#
# ACCIONES FIJADAS POR SHA, por el mismo motivo que en `ci.yml`: una etiqueta
# como `@v4` es mutable, y este flujo tiene en disco la llave de firma. Es el
# último sitio donde conviene confiar en una etiqueta.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      etiqueta:
        description: 'Etiqueta de la versión a la que adjuntar el APK (p. ej. v0.4.0)'
        required: true

permissions:
  contents: write

jobs:
  apk:
    name: APK firmado (Tauri · arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ETIQUETA: ${{ github.event.release.tag_name || inputs.etiqueta }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.release.tag_name || inputs.etiqueta }}

      - name: Configurar JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Instalar los componentes del SDK de Android
        run: |
          set -eu
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Añadir el destino de Rust para Android
        # Solo arm64: cubre los teléfonos de los últimos años. Los de 32 bits
        # quedan fuera, y así lo dice INSTALACION.md.
        run: rustup target add aarch64-linux-android

      - name: Configurar Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Colocar la llave de firma
        # La llave vive en los secretos del repositorio y se escribe solo en el
        # directorio temporal del runner, que se destruye al terminar. Nunca se
        # imprime ni se sube como artefacto.
        env:
          LLAVE_BASE64: ${{ secrets.SICOT_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "$LLAVE_BASE64" ]; then
            echo "::error::Falta el secreto SICOT_ANDROID_KEYSTORE_BASE64. Ver ADR-013."
            exit 1
          fi
          printf '%s' "$LLAVE_BASE64" | base64 -d > "$RUNNER_TEMP/sicot-android.jks"
          echo "SICOT_ANDROID_KEYSTORE=$RUNNER_TEMP/sicot-android.jks" >> "$GITHUB_ENV"

      - name: Compilar el APK firmado
        working-directory: frontend
        env:
          SICOT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SICOT_ANDROID_KEYSTORE_PASSWORD }}
          SICOT_ANDROID_KEY_ALIAS: ${{ secrets.SICOT_ANDROID_KEY_ALIAS }}
        run: npm run tauri android build -- --apk --target aarch64

      - name: Comprobar que lo firmó la llave del proyecto
        # La compuerta que importa de este flujo. Si el APK saliera firmado con
        # otra llave —un secreto sustituido por error, una llave de pruebas—, los
        # teléfonos que ya tienen SICOT no podrían actualizarlo, y no hay forma
        # de deshacerlo después de publicado. Se compara con la huella escrita
        # en ADR-013 y se detiene la publicación si no coincide.
        run: |
          set -eu
          # SHA-256 del certificado de la llave del proyecto, tal como está en
          # ADR-013 pero en minúsculas y sin los dos puntos, que es como lo
          # imprime apksigner.
          ESPERADA="7fadcab24726a0035269f613a093a50d416bde88f607cc9a79cc71e86a7cfafc"
          APK=$(find frontend/src-tauri/gen/android/app/build/outputs/apk -path '*release*' -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::No se generó ningún APK de publicación."; exit 1; }
          case "$APK" in *unsigned*) echo "::error::El APK salió sin firmar: $APK"; exit 1;; esac
          REAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" \
            | awk -F': ' '/certificate SHA-256 digest/ {print $2; exit}')
          echo "Huella del APK: $REAL"
          [ "$REAL" = "$ESPERADA" ] || { echo "::error::El APK no está firmado con la llave del proyecto (ADR-013)."; exit 1; }
          VERSION="${ETIQUETA#v}"
          cp "$APK" "SICOT_${VERSION}_android-arm64.apk"
          ls -lh "SICOT_${VERSION}_android-arm64.apk"
          echo "APK_FINAL=SICOT_${VERSION}_android-arm64.apk" >> "$GITHUB_ENV"

      - name: Adjuntar el APK a la versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$ETIQUETA" "$APK_FINAL" --clobber
