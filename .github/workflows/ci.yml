name: CI

# Compuerta de calidad de SICOT. Corre en cada PR hacia las ramas compartidas y
# en cada push a esas ramas, para que ningún cambio entre a `develop` sin que las
# pruebas del backend y el chequeo de tipos del frontend estén en verde.
#
# NOTA: la suite end-to-end de Playwright NO corre aquí a propósito — necesita el
# backend, PostgreSQL y las cuentas sembradas del perfil `dev`. Se ejecuta a mano
# (`npm run test:e2e`, ver frontend/README.md) hasta que se monte con servicios.
#
# NOTA: `npm run format:check` (oxfmt) deliberadamente NO está en esta compuerta.
# Se probó al preparar este workflow y reescribe tipos objeto en línea
# (`{ a: T; b: U }` → `{ a: T b: U }`), sintaxis inválida, sobre archivos que ya
# compilaban — confirmado en este mismo repo, no una sospecha. Gatear la CI con
# eso rompería cualquier PR que tocara un archivo con ese patrón. Revisar de
# nuevo cuando oxfmt publique una versión más allá de 0.2.x.
#
# ACCIONES FIJADAS POR SHA, NO POR ETIQUETA. Cada `uses:` apunta al commit
# exacto, con la versión legible en un comentario al lado. Una etiqueta como
# `@v4` es MUTABLE: quien controle ese repositorio puede reapuntarla a otro
# código, y ese código corre aquí dentro, con el árbol de SICOT en disco y los
# secretos que el job tenga a la vista. Es la vía por la que han entrado varios
# compromisos reales de cadena de suministro en GitHub Actions. Un SHA no se
# puede reapuntar.
#
# El coste —que las acciones se quedan viejas— lo cubre Dependabot, que tiene el
# ecosistema `github-actions` configurado y sube el SHA y su comentario a la vez.
# Al añadir una acción nueva, resolver su SHA así:
#   gh api repos/OWNER/REPO/git/ref/tags/vX --jq '.object.sha'

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

# Si se empuja dos veces seguidas a la misma rama, cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 25 · Maven · PostgreSQL 18)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # PostgreSQL real, la misma versión mayor que usa el despliegue. No
    # reemplaza a H2: el grueso de la suite sigue corriendo en memoria por
    # velocidad. Está aquí para que EsquemaPostgreSqlIntegrationTest tenga base
    # contra la cual construir el esquema con Flyway y comprobar que Hibernate
    # lo valide — la única prueba capaz de detectar que una migración y una
    # entidad dejaron de coincidir. Sin este servicio esa prueba se salta sola y
    # el desfase volvería a descubrirse en el arranque de producción.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: sicot
          POSTGRES_USER: sicot
          POSTGRES_PASSWORD: sicot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sicot -d sicot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar y probar
        # `verify` cubre compilación + pruebas unitarias e de integración (H2)
        # + la verificación del esquema contra PostgreSQL.
        # -B (batch) evita salida interactiva; -ntp oculta el ruido de descargas.
        run: ./mvnw -B -ntp verify
        env:
          # Presentes solo aquí: en una máquina de desarrollo sin base, la
          # prueba de esquema se salta sola y `mvn verify` sigue en verde.
          SICOT_IT_DB_URL: jdbc:postgresql://localhost:5432/sicot
          SICOT_IT_DB_USERNAME: sicot
          SICOT_IT_DB_PASSWORD: sicot_ci

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reportes-pruebas-backend
          path: backend/target/surefire-reports/
          retention-days: 7
          if-no-files-found: ignore

      - name: Publicar informe de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cobertura-backend
          path: backend/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend (Node 22 · TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Chequeo de tipos
        run: npm run typecheck

      - name: Pruebas
        run: npm run test:run

      - name: Compilar
        run: npm run build

  mcp:
    name: MCP (Node 22 · TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp

    # El servidor MCP es código TypeScript versionado en este repositorio y
    # hasta ahora no lo compilaba nadie en CI: un cambio que lo rompiera se
    # descubría al ejecutarlo a mano, o no se descubría.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

  dependencias:
    name: Vulnerabilidades en dependencias
    runs-on: ubuntu-latest

    # LA COMPUERTA de dependencias, y está separada del informe de abajo por una
    # razón concreta: para que pueda ser un chequeo OBLIGATORIO de la rama.
    #
    # Antes esto y OWASP Dependency-Check vivían en el mismo job, y eso ataba la
    # duración del conjunto a la del más lento: Dependency-Check descarga la base
    # de la NVD y tarda más de media hora. Un chequeo obligatorio de 35 minutos
    # en un equipo de tres personas no se tolera dos semanas — se termina
    # quitando de la lista, y entonces no hay compuerta ninguna, que es
    # exactamente el estado del que venimos (ver ADR-011).
    #
    # Así, esto tarda ~3 minutos y puede exigirse de verdad; el informe completo
    # sigue publicándose aparte sin bloquear a nadie.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # DOS UMBRALES, NO UNO. Antes había sólo `--audit-level=high` sobre el
      # árbol completo, y eso dejaba pasar en silencio exactamente el caso que
      # apareció en la auditoría del 8 de septiembre: tres avisos MODERADOS en
      # `hono`, una dependencia de producción del MCP. Un aviso moderado en algo
      # que se ejecuta delante del usuario merece más atención que uno alto en
      # una herramienta que sólo corre en la máquina de quien desarrolla.
      - name: Auditar dependencias de producción del frontend
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=moderate

      - name: Auditar el árbol completo del frontend
        working-directory: frontend
        # `high` para el árbol de desarrollo: por debajo de eso el ruido supera
        # a la señal, y el equipo aprendería a ignorar el job — que es peor que
        # no tenerlo.
        run: npm audit --audit-level=high

      - name: Auditar dependencias de producción del MCP
        working-directory: mcp
        run: npm audit --omit=dev --audit-level=moderate

      - name: Auditar el árbol completo del MCP
        working-directory: mcp
        run: npm audit --audit-level=high

      - name: Configurar JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Poblar el caché de Maven antes de escanear
        working-directory: backend
        # Trivy resuelve el árbol del `pom.xml` por su cuenta. Sin el caché
        # local poblado pide cada POM a Maven Central y acaba recibiendo un 429
        # que aborta el escaneo — comprobado. Resolver aquí primero hace que
        # Trivy lea del disco.
        run: ./mvnw -B -ntp dependency:go-offline

      - name: Escanear dependencias con Trivy
        # ESTA es la compuerta real de dependencias. OWASP Dependency-Check
        # (abajo) informa pero no bloquea: depende de la NVD, que se cae y
        # limita por IP. Trivy trae su propia base, no necesita clave, es
        # gratuito y sin límite de uso, y cubre los tres ecosistemas del
        # repositorio a la vez — Maven, npm del frontend y npm del MCP.
        #
        # `--ignore-unfixed`: si todavía no existe versión corregida, bloquear
        # el PR no protege de nada y sólo impide trabajar. Aparece igual en el
        # informe.
        #
        # La imagen se fija por versión y no por `latest` por el mismo motivo
        # que las acciones se fijan por SHA: `latest` es mutable.
        run: |
          docker run --rm \
            -v "$PWD:/proyecto" \
            -v "$HOME/.m2:/root/.m2" \
            aquasec/trivy:0.74.0 fs \
              --scanners vuln \
              --severity CRITICAL,HIGH \
              --ignore-unfixed \
              --exit-code 1 \
              --no-progress \
              --skip-dirs node_modules \
              --skip-dirs target \
              /proyecto

  informe-de-dependencias:
    name: Informe de dependencias (OWASP)
    runs-on: ubuntu-latest

    # Segunda opinión sobre el backend, con otra base de datos (la NVD). NO es
    # compuerta y no debe serlo: depende de un servicio externo que se cae y
    # limita por IP, así que como bloqueo produciría PRs rojos que no dicen nada
    # del código. La compuerta es Trivy, en el job de arriba. Éste aporta el
    # informe HTML detallado, que es lo que se mira cuando hay que entender un
    # hallazgo en vez de sólo saber que existe.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Auditar dependencias del backend (OWASP Dependency-Check)
        working-directory: backend
        continue-on-error: true
        run: >-
          ./mvnw -B -ntp org.owasp:dependency-check-maven:12.1.0:check
          -DfailBuildOnCVSS=8
          -DassemblyAnalyzerEnabled=false

      - name: Publicar informe de vulnerabilidades
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check
          path: backend/target/dependency-check-report.html
          retention-days: 7
          if-no-files-found: ignore

  analisis-estatico:
    name: Análisis estático de seguridad
    runs-on: ubuntu-latest

    # Lo que el escaneo de dependencias no ve: fallos en el código propio y
    # credenciales pegadas por descuido. Las dos herramientas son libres, sin
    # cuenta ni clave y sin límite de uso, y se ejecutan como contenedor en vez
    # de como acción de GitHub para no añadir más código de terceros con acceso
    # al repositorio (ver la nota sobre acciones fijadas por SHA, arriba).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Gitleaks recorre el historial: un secreto borrado en un commit
          # posterior sigue estando en los objetos de Git y sigue siendo válido
          # hasta que se rote. Con el checkout superficial por defecto sólo se
          # vería el último commit, que es justo donde no está.
          fetch-depth: 0

      - name: Semgrep — análisis estático de seguridad
        run: |
          docker run --rm -v "$PWD:/src" \
            semgrep/semgrep:1.175.1 semgrep \
              --config=p/security-audit \
              --config=p/secrets \
              --config=p/owasp-top-ten \
              --metrics=off \
              --timeout=60 \
              --exclude=node_modules --exclude=target --exclude=dist \
              --error

      - name: Gitleaks — secretos en el árbol y en el historial
        # La configuración vive en `.gitleaks.toml`, que permite por CONTENIDO
        # los valores de laboratorio del proyecto (contraseñas de las cuentas
        # demo, secreto JWT de `dev`, rellenos del propio CI). Con ella el
        # escaneo sale en cero, así que cualquier hallazgo aquí es nuevo y hay
        # que mirarlo. Nunca se permite por ruta: una credencial real pegada en
        # una prueba tiene que seguir saltando.
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1 \
            git /repo --no-banner --redact --exit-code 1

  imagenes:
    name: Construcción de imágenes Docker
    runs-on: ubuntu-latest

    # Los Dockerfile no se construían en CI, así que un error en cualquiera de
    # los dos solo aparecía al desplegar. Se construyen sin publicar nada: el
    # objetivo es comprobar que compilan, no distribuirlas.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Construir imagen del backend
        run: docker build -t sicot-backend:ci ./backend

      - name: Construir imagen del frontend
        run: docker build -t sicot-frontend:ci ./frontend

      - name: Comprobar la configuración de nginx dentro de la imagen
        # Un error de sintaxis en nginx.conf no rompe el `docker build` — la
        # imagen se construye igual y el contenedor falla al arrancar. `nginx -t`
        # lo detecta aquí.
        run: docker run --rm sicot-frontend:ci nginx -t

      - name: Validar los archivos de Compose
        # `config` resuelve variables, fusiona los dos archivos y falla si algo
        # no cuadra. Las variables obligatorias del perfil de producción se
        # rellenan con valores de relleno: aquí se valida la estructura, no los
        # secretos.
        env:
          DB_PASSWORD: valor-de-relleno-para-ci
          JWT_SECRET: dmFsb3ItZGUtcmVsbGVuby1wYXJhLWNpLXNvbG8tZXN0cnVjdHVyYQ==
          SICOT_ADMIN_EMAIL: ci@ejemplo.invalid
          SICOT_ADMIN_PASSWORD: relleno-solo-para-ci-1234
          # El proxy con TLS de ADR-009 exige un dominio explícito: sin él, el
          # despliegue no sabría para qué nombre pedir certificado. Aquí solo se
          # valida la estructura del archivo, así que basta un nombre de relleno.
          SICOT_DOMINIO: sicot.ci.invalid
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null
