name: Android

# Compuerta del empaquetado móvil de SICOT (ADR-012).
#
# POR QUÉ ESTÁ EN SU PROPIO FICHERO Y NO EN ci.yml. Lo que este job protege no
# cambia casi nunca, y compilarlo es caro: hay que bajar el NDK y compilar Rust
# en cruzado contra él. La forma de decir «solo cuando toque» en GitHub Actions
# es un filtro `paths`, y ese filtro se aplica al flujo de trabajo entero, no a
# un job suelto. Meterlo en `ci.yml` habría obligado a simular el filtro con una
# condición dentro del job —que en la práctica no filtra nada, porque el job
# arranca igual— o a añadir una acción de terceros que calcule los ficheros
# cambiados, es decir más superficie que auditar por una comodidad.
#
# QUÉ PROTEGE. ADR-012 decidió versionar el proyecto de Gradle que genera Tauri.
# La decisión es la correcta —si no se versiona, se pierden los ajustes hechos a
# mano—, pero deja código en el repositorio que nadie compilaba: un cambio en el
# manifiesto, en `build.gradle.kts` o en las versiones del plugin de Rust entraba
# a `develop` con el CI entero en verde, y el defecto aparecía semanas después en
# la máquina de otra persona. Ya hay antecedente de lo caro que sale eso: el
# fallo de enlaces simbólicos de Windows documentado en `frontend/README.md`
# costó una tarde buscando la causa donde no estaba, y el síntoma llegaba
# DESPUÉS de compilarlo todo.
#
# La lección de MDL-145 —una compuerta lenta acaba quitándose— está aplicada por
# delante y no a posteriori: se compila un solo destino, en depuración, y solo
# cuando cambia algo que puede romperlo.
#
# ACCIONES FIJADAS POR SHA, por el mismo motivo que en `ci.yml`: una etiqueta
# como `@v4` es mutable y quien controle ese repositorio puede reapuntarla.

on:
  pull_request:
    branches: [develop, master]
    paths:
      - 'frontend/src-tauri/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/android.yml'
  push:
    branches: [develop, master]
    paths:
      - 'frontend/src-tauri/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    name: APK de depuración (Tauri · aarch64)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configurar JDK 21
        # 21 y no 25, que es la del backend: Gradle todavía no admite 25. Si
        # alguien sube esta versión sin comprobarlo, el fallo llega como un error
        # de Gradle sobre una clase de Java y no señala la causa.
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Instalar los componentes del SDK de Android
        # Con el `sdkmanager` del SDK que el runner ya trae, y no con una acción
        # de terceros: la forma más barata de no tener que auditar una acción más
        # es no añadirla.
        #
        # Las versiones son las que declara el propio proyecto de Gradle
        # (`compileSdk` y `targetSdk` = 36) y el NDK que fija Tauri. Si esas dos
        # se separan, este paso es el que lo dice.
        run: |
          set -eu
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Añadir el destino de Rust para Android
        # Solo aarch64. Los otros tres destinos existen para emuladores y
        # teléfonos viejos; compilar los cuatro multiplicaría por cuatro el paso
        # más lento para detectar exactamente los mismos defectos de
        # configuración, que es lo que este job vigila.
        run: rustup target add aarch64-linux-android

      - name: Caché de Rust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: android-rust-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: android-rust-

      - name: Configurar Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Compilar el APK de depuración
        # `--debug` y no publicación: lo que este job protege es que el proyecto
        # de Android siga compilando, y para eso las dos sirven igual. La de
        # publicación exige además una firma, que es una decisión de cuenta
        # institucional y no de código (ADR-012).
        working-directory: frontend
        run: npm run tauri android build -- --debug --apk --target aarch64

      - name: Decir cuánto pesa
        # El tamaño es el número que hace falta para hablar de distribución, y
        # aquí sale gratis. Sin esto habría que compilar a mano para saberlo.
        if: always()
        run: |
          set -eu
          find frontend/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print0 \
            | xargs -0 -r ls -lh

      # El APK se guardaba en el runner y se tiraba. Para probar un cambio en un
      # teléfono o en un emulador había que compilarlo a mano, y esta máquina de
      # desarrollo no tiene el NDK: el 22 de septiembre la cámara quedó sin probar
      # en un dispositivo justo por eso. Siete días bastan para probar el PR; lo
      # que se distribuye sale firmado de publicar-apk.yml, no de aquí.
      - name: Publicar el APK de depuración
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sicot-debug-aarch64
          path: frontend/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7
          if-no-files-found: error
