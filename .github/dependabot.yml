# Actualizaciones automáticas de dependencias.
#
# El CI ya detecta vulnerabilidades conocidas (npm audit y OWASP
# Dependency-Check), pero detectarlas no las corrige: alguien tiene que
# acordarse de subir la versión. Dependabot abre el PR por su cuenta.
#
# Frecuencia semanal y no diaria a propósito: con un equipo de tres personas,
# un aluvión de PRs se ignora, y una lista ignorada es lo mismo que no tenerla.
#
# SOLO ACTUALIZACIONES MENORES Y DE PARCHE. La primera configuración no lo
# limitaba y Dependabot abrió nueve PRs en el primer minuto, casi todos saltos
# de versión mayor: TypeScript de 5.9 a 7.0, actions/checkout de v4 a v7. Ese
# tipo de salto rompe el build o cambia comportamiento, necesita que alguien lo
# evalúe con tiempo, y mezclado con las actualizaciones rutinarias hace que
# nadie lea ninguna.
#
# Las versiones mayores se suben a mano, a propósito y de una en una.
#
# OJO CON LO QUE ESTE FILTRO SÍ ALCANZA. Aquí decía que las actualizaciones de
# SEGURIDAD no pasaban por él y que Dependabot las abría igual aunque
# implicaran un salto mayor. No es cierto, y se comprobó del peor modo: la
# alerta crítica de Apache Tika (CVE-2025-66516, XXE) se abrió el 2 de
# septiembre de 2026 con `dependabot_security_updates` habilitado en el
# repositorio, y NUNCA llegó un PR — porque el arreglo estaba en la 3.2.2 y
# esto es un salto mayor desde la 2.9.4 que teníamos.
#
# Consecuencia práctica: una vulnerabilidad cuya corrección viva en una versión
# mayor NO se va a corregir sola. Hay que mirar las alertas de Dependabot
# (pestaña Security del repositorio, o `gh api repos/OWNER/REPO/dependabot/alerts`)
# y subir esa versión a mano. Este filtro sigue mereciendo la pena para el ruido
# rutinario, pero no es una red de seguridad.
#
# `target-branch: develop` en todos los ecosistemas. Por defecto Dependabot
# abre sus PRs contra la rama POR DEFECTO del repositorio, que aquí es
# `master`. Eso se saltaba el modelo de ramas del proyecto: una actualización
# entraba directa a la rama estable sin pasar por integración, y dejaba
# `develop` atrás. Ocurrió de verdad con la primera corrección de seguridad
# que llegó.

version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencias, backend]
    commit-message:
      prefix: "chore(backend)"
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencias, frontend]
    commit-message:
      prefix: "chore(frontend)"
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      # Las herramientas de desarrollo se agrupan en un solo PR: son muchas y
      # su riesgo individual es bajo. Las de producción van sueltas, para
      # poder revisar una por una lo que llega al usuario.
      herramientas-de-desarrollo:
        dependency-type: development

  - package-ecosystem: npm
    directory: /mcp
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencias, mcp]
    commit-message:
      prefix: "chore(mcp)"
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Las propias acciones del CI también envejecen, y una acción sin actualizar
  # es código de terceros ejecutándose con acceso al repositorio.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencias, ci]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
